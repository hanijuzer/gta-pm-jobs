name: Update Job Listings

on:
  schedule:
    # Runs every Monday and Thursday at 7am Toronto time (11:00 UTC)
    - cron: '0 11 * * 1,4'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit index.html back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch jobs and regenerate index.html
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python fetch_jobs.py

      - name: Commit and push updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Only commit if something changed
          git diff --staged --quiet || git commit -m "chore: auto-update job listings $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
